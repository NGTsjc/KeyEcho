[package]
name = "keyecho"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "KeyEcho"
path = "src/main.rs"

[lib]
name = "keyecho"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
rodio = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3.12"
